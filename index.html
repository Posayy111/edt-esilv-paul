function parseICS(txt){

    const s=icsT(d.DTSTART),e=icsT(d.DTEND||d.DTSTART);
    const title=d.TITLE||(d.SUMMARY||"").replace(/^\[[^\]]*\]/,"").replace(/\s*\[[^\]]*\].*$/,"").trim();
    out.push([d.UID||(s.d+s.t+title),s.d,s.t,e.t,title,d.TYPECOURS||"",d.LOCATION||"",d.SITE||"",d.PROF||"",d.NOTES||d.DESCRIPTION||"",d.FLAGPRESENTIEL||""]);

}

}

  const st={meta:Object.assign({},pend.meta,{edited:new Date().toISOString().slice(0,10)}),ev:pend.ev,ov:pend.ov};
  try{sessionStorage.setItem("edt-edit",edit?"1":"0");sessionStorage.setItem("edt-msg",dl?"Enregistré. Télécharge la version pour tes amis pour mettre à jour leur lien.":"Enregistré.")}catch(e){}
  try{await art.publish(buildPage(st));state=st;pend=null;imported=false;notice("Enregistré. Tes amis voient maintenant cette version.");render()}
  catch(err){
    try{sessionStorage.removeItem("edt-msg")}catch(e){}
    const c=err&&err.code;
    if(c==="conflict")notice("Une version plus récente vient d’être enregistrée : la page se recharge avec elle.");
    else if(["not_writer","not_granted","not_declared","consent_required","capability_disabled","capability_removed"].includes(c)){canEdit=false;edit=false;notice("Cette vue est en lecture seule : les modifications ne peuvent pas être enregistrées ici.");render()}
    else if(c==="rate_limited")notice("Trop d’enregistrements rapprochés. Réessaie dans une minute.");
    else if(c==="too_large")notice("La page dépasse la taille maximale autorisée.");
    else notice("L’enregistrement a échoué. Réessaie dans un instant.");
  }
  finally{saving=false;b.textContent="Enregistrer";b.removeAttribute("aria-busy")}
}
async function exportFriends(){
  if(!dl)return;
  try{const r=await dl.save({filename:"index.html",data:new Blob([buildPage(state)],{type:"text/html"})});if(r&&r.status==="saved")notice((pend?"Fichier téléchargé, sans tes modifications pas encore enregistrées. ":"Fichier téléchargé. ")+"Remplace l’ancien index.html sur ton hébergement pour mettre à jour le lien de tes amis.")}
  catch(e){const c=e&&e.code;if(c==="declined")return;notice(c==="rate_limited"?"Un téléchargement est déjà en attente.":"Le téléchargement n’est pas disponible dans cette vue.")}
}
async function initCaps(){
  const cl=window.claude;if(!cl||typeof cl.use!=="function")return;
  try{const [u,a,w]=await Promise.all([cl.use("user"),cl.use("artifact"),cl.use("downloads")]);art=a;dl=w;canEdit=!!(a&&u&&await u.canEdit())}catch(e){canEdit=false}
  if(!canEdit)return;
  try{const m=sessionStorage.getItem("edt-msg");if(m){notice(m);sessionStorage.removeItem("edt-msg")}}catch(e){}
  try{edit=sessionStorage.getItem("edt-edit")==="1";sessionStorage.removeItem("edt-edit")}catch(e){}
  render();
}
function wire(){
  document.querySelector(".views").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;prefs.view=b.dataset.v;savePrefs();render()});
  $("#chips").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;if(k==="*")prefs.off=[];else{const s=new Set(prefs.off);s.has(k)?s.delete(k):s.add(k);prefs.off=[...s]}savePrefs();render()});
  $("#pills").addEventListener("click",e=>{const a=e.target.closest("[data-wk]");if(!a)return;const s=document.getElementById("w-"+a.dataset.wk);if(s)s.scrollIntoView({behavior:RM?"auto":"smooth",block:"start"})});
  $("#weeks").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b&&B[+b.dataset.i])openDlg(B[+b.dataset.i])});
  $("#owner").addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;if(t.id==="startEdit"){edit=true;render();fillDlg()}else if(t.id==="done"){edit=false;render();fillDlg()}else if(t.id==="imp")$("#file").click();else if(t.id==="exp")exportFriends()});
  $("#file").addEventListener("change",onImport);
  $("#sb-undo").addEventListener("click",()=>{pend=null;imported=false;notice("");render();fillDlg()});
  $("#sb-save").addEventListener("click",save);
  const d=$("#dlg");
  $("#dlg-x").addEventListener("click",()=>d.close());
  d.addEventListener("click",e=>{if(e.target===d)d.close()});
  d.addEventListener("close",()=>{dlgUids=null});
  $("#dlg-b").addEventListener("change",e=>{const i=e.target.closest("[data-f]");if(i)setField(i.closest(".sess"),i.dataset.f,i)});
  $("#dlg-b").addEventListener("click",e=>{const r=e.target.closest("[data-reset]");if(!r)return;ensurePend();delete pend.ov[r.closest(".sess").dataset.uid];render();fillDlg()});
  window.addEventListener("beforeunload",e=>{if(pend&&!saving){e.preventDefault();e.returnValue=""}});
}
document.getElementById("root").innerHTML=SHELL;
wire();render();initCaps();
})();
</script>
</body>
